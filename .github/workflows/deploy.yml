name: Publicar sitio

# Cada push a main vuelve a publicar el sitio en GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, se publica el último y se cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El mismo script que usa Cloudflare Pages, para que los dos despliegues
      # publiquen exactamente lo mismo y no puedan divergir.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Armar carpeta de publicación
        run: node tools/build-site.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

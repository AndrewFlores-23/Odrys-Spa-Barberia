name: Publicar sitio (respaldo)

# El sitio se publica desde Cloudflare, que despliega solo con cada push.
# Este flujo queda como respaldo manual: si Cloudflare fallara, se puede
# lanzar a mano desde la pestaña Actions y GitHub Pages vuelve a servir.
#
# Se quitó el disparo automático a propósito. Con los dos activos había el
# mismo sitio publicado en dos direcciones, y las URL canónicas apuntan a
# odrysbeautyspa.com: dejar GitHub Pages sirviendo en paralelo confunde a
# los buscadores sin aportar nada.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El mismo script que usa Cloudflare, para que ambos publiquen lo mismo.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Armar carpeta de publicación
        run: node tools/build-site.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
